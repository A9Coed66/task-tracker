<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Task Canvas</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="app">
    <header class="toolbar">
      <div class="toolbar__side" aria-hidden="true"></div>
      <h1 class="toolbar__brand">Task Canvas</h1>
      <div class="toolbar__side toolbar__side--end">
        <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Switch to dark mode">
          Dark
        </button>
      </div>
    </header>
    <div class="app-body">
      <div class="viewport">
        <div id="canvas" class="canvas" tabindex="0">
          <div id="canvas-world" class="canvas-world">
            <svg id="connectors" class="connectors" aria-hidden="true"></svg>
            <div id="nodes"></div>
            <div id="preview" class="preview-box" hidden></div>
          </div>
        </div>
      </div>
      <aside
        class="inspector inspector--collapsed"
        id="task-inspector"
        style="--inspector-width: 272px"
        aria-label="Inspector"
      >
        <div
          class="inspector__resize"
          id="inspector-resize-handle"
          role="separator"
          aria-orientation="vertical"
          aria-label="Kéo để đổi chiều rộng Inspector"
          tabindex="0"
        ></div>
        <button type="button" class="inspector__open-tab" id="inspector-open-tab" aria-label="Mở Inspector" aria-controls="inspector-inner" aria-expanded="false">
          <svg class="inspector__chev" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="currentColor" d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" />
          </svg>
        </button>
        <div class="inspector__inner" id="inspector-inner" hidden>
          <div class="inspector__head">
            <h2 class="inspector__title" id="inspector-title">Inspector</h2>
            <button type="button" class="inspector__collapse" id="inspector-collapse" aria-label="Thu gọn Inspector" aria-controls="inspector-inner" aria-expanded="true">
              <svg class="inspector__chev" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path fill="currentColor" d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z" />
              </svg>
            </button>
          </div>
          <div id="inspector-panel" class="inspector__panel" hidden>
            <p class="inspector__task-id" id="inspector-task-label"></p>
            <div class="inspector__fieldset inspector__fieldset--noframe">
              <button type="button" class="inspector__delete" id="inspector-delete-task">
                Xóa task (cả nhánh con)
              </button>
            </div>

            <fieldset class="inspector__fieldset inspector__fieldset--icons">
              <legend class="inspector__legend-sr">Căn ngang nội dung trong ô</legend>
              <div class="seg seg--icon seg--icon-3" role="group" aria-label="Căn ngang nội dung">
                <button type="button" class="seg__btn seg__btn--icon" data-align-h="left" aria-label="Căn trái" aria-pressed="false">
                  <svg class="seg__icon" viewBox="0 0 20 20" width="20" height="20" aria-hidden="true">
                    <path fill="currentColor" d="M2 3h8v2h-8v-2zm0 3.5h14v2h-14v-2zm0 3.5h10v2h-10v-2zm0 3.5h6v2h-6v-2z" />
                  </svg>
                </button>
                <button type="button" class="seg__btn seg__btn--icon" data-align-h="center" aria-label="Căn giữa ngang" aria-pressed="false">
                  <svg class="seg__icon" viewBox="0 0 20 20" width="20" height="20" aria-hidden="true">
                    <path fill="currentColor" d="M6 3h8v2h-8v-2zm-3 3.5h14v2h-14v-2zm2 3.5h10v2h-10v-2zm2 3.5h6v2h-6v-2z" />
                  </svg>
                </button>
                <button type="button" class="seg__btn seg__btn--icon" data-align-h="right" aria-label="Căn phải" aria-pressed="false">
                  <svg class="seg__icon" viewBox="0 0 20 20" width="20" height="20" aria-hidden="true">
                    <path fill="currentColor" d="M10 3h8v2h-8v-2zm-6 3.5h14v2h-14v-2zm4 3.5h10v2h-10v-2zm4 3.5h6v2h-6v-2z" />
                  </svg>
                </button>
              </div>
            </fieldset>

            <div class="inspector__fieldset inspector__fieldset--noframe">
              <span class="inspector__label" id="label-font-size">Cỡ chữ (px)</span>
              <div class="inspector__row inspector__row--color">
                <input type="number" id="inspector-font-size" class="inspector__font-size" min="10" max="40" step="1" aria-labelledby="label-font-size" />
                <button type="button" class="inspector__reset inspector__reset--narrow" id="inspector-font-size-reset">Reset</button>
              </div>
            </div>

            <div class="inspector__fieldset inspector__fieldset--noframe">
              <span class="inspector__label" id="label-border-color">Màu viền</span>
              <div class="inspector__row inspector__row--color">
                <input type="color" id="inspector-border-color" class="inspector__color inspector__color--wide" aria-labelledby="label-border-color" />
                <button type="button" class="inspector__reset inspector__reset--narrow" id="inspector-border-reset">Reset</button>
              </div>
            </div>

            <div class="inspector__fieldset inspector__fieldset--noframe">
              <span class="inspector__label" id="label-bg-color">Màu nền (ô)</span>
              <div class="inspector__row inspector__row--color">
                <input type="color" id="inspector-bg-color" class="inspector__color inspector__color--wide" aria-labelledby="label-bg-color" />
                <button type="button" class="inspector__reset inspector__reset--narrow" id="inspector-bg-reset">Reset</button>
              </div>
            </div>
          </div>
        </div>
      </aside>
    </div>
    <script src="app.js"></script>
  </body>
</html>
